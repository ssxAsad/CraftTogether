name: Build macOS Distributable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build CraftTogether for macOS (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & Electron bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-tsc-vite.log || {
            ERR=$(tail -n 25 build-tsc-vite.log | tr '\n' ' ')
            echo "::error::Build failed: $ERR"
            exit 1
          }

      - name: Package macOS (.dmg and .zip for arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --mac zip --arm64 --x64 --publish never 2>&1 | tee build-zip.log || {
            ERR=$(tail -n 25 build-zip.log | tr '\n' ' ')
            echo "::error::ZIP package failed: $ERR"
            exit 1
          }
          for attempt in 1 2 3; do
            echo "Building macOS DMG (attempt $attempt/3)..."
            if npx electron-builder --mac dmg --arm64 --x64 --publish never 2>&1 | tee build-dmg.log; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              ERR=$(tail -n 25 build-dmg.log | tr '\n' ' ')
              echo "::error::DMG package failed: $ERR"
              exit 1
            fi
            sleep 5
          done
          ls -lh release/

      - name: Upload macOS Distributables (Apple Silicon arm64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-AppleSilicon-arm64
          path: |
            release/*arm64*.dmg
            release/*arm64*.zip
          if-no-files-found: error

      - name: Upload macOS Distributables (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-Intel-x64
          path: |
            release/*x64*.dmg
            release/*x64*.zip
          if-no-files-found: error

      - name: Publish Public GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          ## CraftTogether for macOS

          Choose the installer matching your Mac:
          - **Apple Silicon (M1 / M2 / M3 / M4):** `CraftTogether-macOS-arm64-1.0.0.dmg`
          - **Intel Mac:** `CraftTogether-macOS-x64-1.0.0.dmg`

          ### First-Time Setup (Unsigned Test Build)
          1. Open the `.dmg` and drag **CraftTogether** into **Applications**.
          2. Because this build is not Apple-notarized yet, run this once in **Terminal** before opening:
             ```bash
             xattr -cr /Applications/CraftTogether.app
             ```
          3. Launch **CraftTogether** — Java 21 (Temurin) and PlayIt.gg v2.0.2 (universal macOS) download automatically inside your chosen workspace folder.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg release/*.zip --clobber
          else
            gh release create "$TAG" release/*.dmg release/*.zip \
              --title "CraftTogether $TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
