name: Build macOS Distributable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build CraftTogether for macOS (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package macOS (.dmg and .zip for arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac

      - name: Upload macOS Distributables (Apple Silicon arm64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-AppleSilicon-arm64
          path: |
            release/*arm64*.dmg
            release/*arm64*.zip
          if-no-files-found: error

      - name: Upload macOS Distributables (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-Intel-x64
          path: |
            release/*x64*.dmg
            release/*x64*.zip
          if-no-files-found: error
