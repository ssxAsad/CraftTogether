name: Build macOS Distributable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build CraftTogether for macOS (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & Electron bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-tsc-vite.log || {
            ERR=$(tail -n 25 build-tsc-vite.log | tr '\n' ' ')
            echo "::error::Build failed: $ERR"
            exit 1
          }

      - name: Package macOS (.dmg and .zip for arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --mac zip --arm64 --x64 2>&1 | tee build-zip.log || {
            ERR=$(tail -n 25 build-zip.log | tr '\n' ' ')
            echo "::error::ZIP package failed: $ERR"
            exit 1
          }
          for attempt in 1 2 3; do
            echo "Building macOS DMG (attempt $attempt/3)..."
            if npx electron-builder --mac dmg --arm64 --x64 2>&1 | tee build-dmg.log; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              ERR=$(tail -n 25 build-dmg.log | tr '\n' ' ')
              echo "::error::DMG package failed: $ERR"
              exit 1
            fi
            sleep 5
          done
          ls -lh release/

      - name: Upload macOS Distributables (Apple Silicon arm64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-AppleSilicon-arm64
          path: |
            release/*arm64*.dmg
            release/*arm64*.zip
          if-no-files-found: error

      - name: Upload macOS Distributables (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: CraftTogether-macOS-Intel-x64
          path: |
            release/*x64*.dmg
            release/*x64*.zip
          if-no-files-found: error
